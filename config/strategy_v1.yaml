# strategy_v1 configuration (STEP 3)
# 本文件是第一版策略的唯一参数来源；任何参数变更必须另建 run 并记录，
# 严禁为了"收益更好"反复调参（详见 ROADMAP 与 reports/step3_strategy_v1.md）。

strategy:
  name: strategy_v1
  version: "1.0"

data:
  source: canonical                    # DuckDB + Parquet（STEP 2）
  snapshot_id: auto                    # 运行 manifest 自动记录
  min_history_days: 120                # 特征所需前置历史（Alpha158 最长 60 窗口）

rebalance:
  frequency: monthly                   # 第一版固定 monthly；代码支持 weekly/daily
  rule: last_trading_day               # 每月最后一个交易日收盘生成信号

universe:
  exchanges: [SH, SZ]                  # 第一版排除 BSE（架构支持后续加入）
  min_listing_days: 180                # 新股过滤（可配置）
  liquidity:
    enabled: true
    window_days: 20                    # 过去 20 个交易日平均成交额
    min_amount: 100000                 # 源单位（见下方 caveat）；保留约 1,800-1,900 只
    caveat: >-
      canonical 的 volume/amount 字段存在每股不同的源侧缩放（Yahoo 调整伪影，
      实测与腾讯原始成交量之比在 0.008-0.20 之间随股票而异），跨股票不可比。
      v1 因此把流动性过滤设为低阈值粗过滤（只剔除接近无成交的股票），
      精确的历史流动性数据留待 STEP 4 引入干净的成交量源后重建。
  st_filter:
    enabled: false                     # 历史回测：无历史 ST 状态数据，禁用并记录限制（PIT 原则）
    note: >-
      历史 ST 状态在 canonical 层不可得（只有当前快照 is_st）。为避免把
      今天的 ST 状态回填历史（未来函数），回测关闭此过滤；paper live
      使用当前快照状态（enabled=true 覆盖）。
  suspension:
    max_absent_days: 10                # 调仓日前 N 个交易日内无成交记录 -> 视为长期停牌，排除

features:
  handler: Alpha158                    # qlib 官方 Alpha158，不重造
  module_path: qlib.contrib.data.handler
  cache_dir: data/derived/features     # 月度特征切片缓存（DERIVED 层）

label:
  horizon_days: 20                     # 未来 20 个交易日收益
  definition: adjusted_return          # (close[t+20]*factor[t+20])/(close[t]*factor[t])-1

model:
  type: LightGBM                       # 第一版只有 LightGBM
  seed: 42
  params:                              # 固定参数，不自动调参
    objective: regression
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    n_estimators: 400
    early_stopping_rounds: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l1: 1.0
    lambda_l2: 1.0
    min_child_samples: 20
    num_threads: 20
  training_frequency: quarterly        # walk-forward 每季度重训（配置化）

time_split:                            # 严格时间前向，禁止随机切分
  train: [2015-01-01, 2021-12-31]
  valid: [2022-01-01, 2023-12-31]
  test:  [2024-01-01, 2025-12-31]
  paper_live_start: 2026-01-01         # 2026 完全保留为 out-of-sample

portfolio:
  top_k: 20
  cash_buffer: 0.05                    # 股票总权重 95%，每只 4.75%
  weighting: equal_weight

execution:
  timing: T1_open                      # T 日收盘信号 -> T+1 开盘执行
  limit_threshold: 0.095               # 涨跌停阈值（10% 制度）
  on_limit: NO_TRADE                   # 涨停不追买 / 跌停不卖
  on_no_bar: NO_TRADE                  # T+1 无行情（停牌）不成交
  lot_size: 100                        # A 股买入 100 股整数倍

transaction_costs:                     # 保守参数；不代表任何券商实际费率
  commission_rate: 0.00025             # 佣金（买卖双向）
  min_commission: 5.0                  # 最低佣金（元）
  stamp_duty: 0.0005                   # 印花税（卖出）
  transfer_fee: 0.00001                # 过户费（双向）
  slippage: 0.0005                     # 滑点（单边）

baselines:
  buy_and_hold_indexes: [000300.SH, 000905.SH, 000852.SH, 000985.SH]
  momentum:
    enabled: true
    lookback_days: 60
    top_k: 20
  equal_weight_market: true

experiment:
  dir: experiments/strategy_v1
  save_predictions: true               # 每月预测落盘（复盘用）
