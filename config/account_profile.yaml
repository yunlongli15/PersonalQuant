# 账户档案：资金规模与板块权限（交易计划用它判断"能不能买"）
#
# 板块开通门槛（券商统一执行，20 个交易日日均资产）：
#   科创板 688xxx.SH  50 万元 + 24 个月交易经验
#   创业板 300/301.SZ 10 万元 + 24 个月交易经验
#   北交所 4/8/920    50 万元 + 24 个月交易经验
#   主板 / ETF         无门槛
#
# ⚠️ 门槛是"开通时"的审核条件：**一旦开通，后续资产下降不会取消权限**。
#    所以下面是资金现状，不等于权限现状——请在券商 APP 确认是否已开通。
#
# experience_months: null = 未核实。未核实时系统给"提示"而不是"禁止"。

account:
  capital: 66000             # 2026-09-17 用户确认：可投资金 6.6 万，空仓
  auto_detect_capital: false # 财富库中暂无真实持仓记录，不做自动探测
  experience_months: null    # 交易经验月数；填了才会严格判断经验门槛
  notes: >-
    6.6 万资金下：科创板（50万）与北交所（50万）不可开通；创业板（10万）
    若尚未开通则无法买入——交易计划会先按此过滤，并把被排除的标的完整列出。
